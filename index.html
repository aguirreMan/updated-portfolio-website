<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="Frontend developer building modern web applications with React, TypeScript, and scalable architecture." />

  <!-- Social sharing (Open Graph: LinkedIn, Facebook, Slack, Discord, iMessage) -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Manuel Aguirre" />

  <!-- X/Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
</head>

<body>
  <!-- Static fallback form for Netlify detection -->
  <form name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="contact" />
    <input type="text" name="bot-field" />
    <input type="text" name="name" />
    <input type="email" name="email" />
    <textarea name="message"></textarea>
  </form>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
